<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雷霆战机 - 空中霸主</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #001122 0%, #003366 50%, #004488 100%);
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            margin: 0 auto;
            width: 480px;
            height: 700px;
            background: linear-gradient(180deg, #001133 0%, #002244 30%, #003355 70%, #004466 100%);
            border: 2px solid #00aaff;
            box-shadow: 0 0 30px #0088ff;
        }

        canvas {
            display: block;
            background: linear-gradient(180deg, #001133 0%, #002244 30%, #003355 70%, #004466 100%);
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 2;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
            padding: 8px 0;
        }

        #ui span {
            margin: 0 10px;
            font-size: 16px;
            color: #00ffff;
            text-shadow: 0 0 8px #00ffff;
            font-weight: bold;
        }

        #upgrade-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #001122 0%, #002244 100%);
            border: 2px solid #00aaff;
            border-radius: 15px;
            padding: 30px 20px 20px 20px;
            z-index: 10;
            display: none;
            min-width: 320px;
            text-align: center;
            box-shadow: 0 0 40px #0088ff;
        }

        #upgrade-panel h2 {
            margin-top: 0;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        .upgrade-option {
            background: linear-gradient(135deg, #003366 0%, #004488 100%);
            border: 1px solid #0088ff;
            border-radius: 8px;
            margin: 10px 0;
            padding: 12px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            color: #fff;
        }

        .upgrade-option:hover {
            background: linear-gradient(135deg, #0055aa 0%, #0066cc 100%);
            box-shadow: 0 0 15px #0088ff;
            transform: translateY(-2px);
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #220011 0%, #440022 100%);
            border: 2px solid #ff4444;
            border-radius: 15px;
            padding: 30px 40px;
            z-index: 20;
            display: none;
            text-align: center;
            box-shadow: 0 0 40px #ff4444;
        }

        #game-over h2 {
            margin-top: 0;
            color: #ff6666;
            text-shadow: 0 0 10px #ff6666;
        }

        #game-over button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 18px;
            background: linear-gradient(135deg, #ff4444 0%, #ff6666 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #game-over button:hover {
            background: linear-gradient(135deg, #ff6666 0%, #ff8888 100%);
            box-shadow: 0 0 15px #ff4444;
        }

        @media (max-width: 700px) {
            #game-container {
                width: 100vw;
                height: 100vh;
            }
        }

        #virtual-joystick {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 220px;
            z-index: 10;
            user-select: none;
            touch-action: none;
            opacity: 0.8;
            display: none;
        }

        .vj-row {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .vj-btn {
            width: 90px;
            height: 90px;
            margin: 0 10px;
            background: rgba(0, 170, 255, 0.2);
            border: 2px solid #00aaff;
            border-radius: 20px;
            font-size: 48px;
            color: #00ffff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .vj-btn.active {
            background: rgba(0, 255, 255, 0.5);
            border: 3px solid #00ffff;
            box-shadow: 0 0 20px #00ffff;
        }

        @keyframes pop {
            0% {
                transform: translateY(0) scale(1.2);
                opacity: 1;
                text-shadow: 0 0 8px #00ffff, 0 0 2px #000
            }
            60% {
                transform: translateY(-40px) scale(1.5);
                opacity: 0.9
            }
            100% {
                transform: translateY(-60px) scale(1.8);
                opacity: 0
            }
        }

        @keyframes explode {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.8;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        @keyframes starfield {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(800px); }
        }
    </style>
</head>

<body>
    <div id="game-container">
        <div id="start-panel"
            style="position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#001133 0%,#002244 50%,#003355 100%);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <div
                style="background:linear-gradient(135deg,#002244 0%,#003366 100%);border-radius:18px;padding:36px 32px 28px 32px;box-shadow:0 4px 40px #0088ff;min-width:320px;text-align:center;border:2px solid #00aaff;">
                <h1 style="margin-bottom:18px;font-size:2.5em;color:#00ffff;letter-spacing:3px;text-shadow:0 0 20px #00ffff;">雷霆战机</h1>
                <div style="font-size:1.3em;margin-bottom:10px;color:#00aaff;font-weight:500;">准备好成为空中霸主了吗？</div>
                <div style="font-size:1em;color:#88ccff;margin-bottom:18px;">（选择难度获得初始装备）</div>
                <div style="margin-bottom:18px;">
                    <button id="btn-easy"
                        style="font-size:1.1em;padding:10px 36px;margin-right:12px;background:linear-gradient(135deg,#4caf50 0%,#66bb6a 100%);color:#fff;border:none;border-radius:8px;box-shadow:0 2px 8px #4caf50;cursor:pointer;transition:all 0.3s;">简单</button>
                    <button id="btn-normal"
                        style="font-size:1.1em;padding:10px 36px;margin-right:12px;background:linear-gradient(135deg,#ff9800 0%,#ffb74d 100%);color:#fff;border:none;border-radius:8px;box-shadow:0 2px 8px #ff9800;cursor:pointer;transition:all 0.3s;">普通</button>
                    <button id="btn-hard"
                        style="font-size:1.1em;padding:10px 36px;background:linear-gradient(135deg,#f44336 0%,#e57373 100%);color:#fff;border:none;border-radius:8px;box-shadow:0 2px 8px #f44336;cursor:pointer;transition:all 0.3s;">困难</button>
                </div>
                <div id="answer-tip" style="font-size:1em;color:#00ffff;height:24px;margin-bottom:18px;"></div>
                <button id="btn-start"
                    style="font-size:1.2em;padding:12px 48px;background:linear-gradient(135deg,#1976d2 0%,#42a5f5 100%);color:#fff;border:none;border-radius:10px;box-shadow:0 2px 8px #1976d2;cursor:pointer;transition:all 0.3s;"
                    disabled>开始战斗</button>
            </div>
        </div>
        <canvas id="game-canvas" width="480" height="700"></canvas>
        <div id="ui">
            <span id="score">积分: 0</span>
            <span id="level">等级: 1</span>
            <span id="exp">经验: 0/10</span>
            <span id="wave">波次: 1</span>
            <span id="hp">生命: 100</span>
        </div>
        <div id="weapon-bar"
            style="position:absolute;top:10px;right:10px;width:280px;background:rgba(0,20,40,0.95);z-index:5;padding:8px;font-size:13px;box-shadow:0 2px 12px #0088ff;border-radius:12px;border:1px solid #0088ff;max-height:400px;overflow-y:auto;display:block;">
            <button id="toggle-weapon-bar"
                style="position:absolute;top:-8px;right:-8px;width:24px;height:24px;background:#ff4444;color:#fff;border:none;border-radius:50%;font-size:16px;cursor:pointer;box-shadow:0 2px 4px #ff4444;z-index:6;">×</button>
            <div id="weapon-content"></div>
        </div>
        <button id="show-weapon-bar"
            style="position:absolute;top:10px;right:10px;width:40px;height:40px;background:#0088ff;color:#fff;border:none;border-radius:50%;font-size:20px;cursor:pointer;box-shadow:0 2px 8px #0088ff;z-index:5;display:none;">📊</button>
        <div id="upgrade-panel">
            <h2>装备升级！选择一项强化</h2>
            <div id="upgrade-options"></div>
        </div>
        <div id="game-over">
            <h2>战机坠毁</h2>
            <div id="final-score"></div>
            <button onclick="restartGame()">重新出击</button>
        </div>
        <div id="virtual-joystick">
            <div class="vj-row">
                <div class="vj-btn" data-dir="up">▲</div>
            </div>
            <div class="vj-row">
                <div class="vj-btn" data-dir="left">◀</div>
                <div class="vj-btn" data-dir="down">▼</div>
                <div class="vj-btn" data-dir="right">▶</div>
            </div>
        </div>
    </div>
    <script>
        let hpFlashTimer = 0;
        let vampCooldown = 0;
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;
        let lastFrameTime = performance.now();

        // UI
        const scoreSpan = document.getElementById('score');
        const levelSpan = document.getElementById('level');
        const expSpan = document.getElementById('exp');
        const waveSpan = document.getElementById('wave');
        const hpSpan = document.getElementById('hp');
        const upgradePanel = document.getElementById('upgrade-panel');
        const upgradeOptionsDiv = document.getElementById('upgrade-options');
        const gameOverDiv = document.getElementById('game-over');
        const finalScoreDiv = document.getElementById('final-score');
        const weaponBar = document.getElementById('weapon-bar');
        const weaponContent = document.getElementById('weapon-content');
        const toggleWeaponBar = document.getElementById('toggle-weapon-bar');

        // 参数栏收起/展开功能
        toggleWeaponBar.onclick = function () {
            weaponBar.style.display = 'none';
            document.getElementById('show-weapon-bar').style.display = 'block';
        };

        // 显示参数栏按钮
        document.getElementById('show-weapon-bar').onclick = function () {
            weaponBar.style.display = 'block';
            this.style.display = 'none';
        };

        // 武器定义 - 飞机主题
        const WEAPON_DEFS = [
            {
                key: 'machinegun',
                name: '机关枪',
                color: '#ffff00',
                baseDamage: 15,
                baseFireRate: 8,
                type: 'line',
                desc: '标准机关枪，射速快，伤害中等',
            },
            {
                key: 'missile',
                name: '导弹',
                color: '#ff4444',
                baseDamage: 35,
                baseFireRate: 45,
                type: 'missile',
                desc: '追踪导弹，自动锁定敌机',
            },
            {
                key: 'laser',
                name: '激光炮',
                color: '#00ff00',
                baseDamage: 8,
                baseFireRate: 3,
                type: 'laser',
                desc: '持续激光，高频率攻击',
            },
            {
                key: 'shotgun',
                name: '散弹枪',
                color: '#ff8800',
                baseDamage: 12,
                baseFireRate: 25,
                type: 'spread',
                desc: '散射弹丸，近距离高伤害',
            },
            {
                key: 'plasma',
                name: '等离子炮',
                color: '#8844ff',
                baseDamage: 25,
                baseFireRate: 35,
                type: 'plasma',
                desc: '等离子球，穿透多个敌人',
            },
            {
                key: 'railgun',
                name: '电磁轨道炮',
                color: '#00ffff',
                baseDamage: 80,
                baseFireRate: 90,
                type: 'railgun',
                desc: '超高伤害，贯穿所有敌人',
            },
            {
                key: 'flamethrower',
                name: '火焰喷射器',
                color: '#ff6600',
                baseDamage: 6,
                baseFireRate: 5,
                type: 'flame',
                desc: '持续火焰伤害，范围攻击',
            },
            {
                key: 'lightning',
                name: '闪电链',
                color: '#aaffff',
                baseDamage: 20,
                baseFireRate: 60,
                type: 'chainlight',
                desc: '闪电弹射，连锁攻击多个敌人',
            },
        ];

        function getWeaponDef(key) {
            return WEAPON_DEFS.find(w => w.key === key);
        }

        // 游戏数据
        let player, bullets, enemies, enemyBullets, particles, upgrades, score, level, exp, expToLevel, wave, hp, gameState, upgradePool, lastUpgradeChoices, bossActive;
        let difficulty = 'normal'; // 难度设置

        function resetGame() {
            player = {
                x: W / 2 - 25, y: H - 100, w: 50, h: 50,
                speed: 6,
                hp: 100,
                maxHp: 100,
                invincible: 0,
                shield: 0,
                rapid: 0,
                dash: 0,
                magnet: false,
                weapons: [
                    { key: 'machinegun', name: '机关枪', level: 1, damage: 15, fireRate: 8, fireRateBonus: 0, fireTimer: 0, count: 1 },
                ],
                skills: [],
                magnetRange: 80,
            };
            bullets = [];
            enemies = [];
            enemyBullets = [];
            particles = [];
            upgrades = [];
            score = 0;
            level = 1;
            exp = 0;
            expToLevel = Math.floor(10 * Math.pow(1.3, level - 1));
            wave = 1;
            hp = 100;
            gameState = 'playing';
            bossActive = false;
            upgradePool = buildUpgradePool();
            lastUpgradeChoices = [];
        }

        // 技能与武器图标定义
        const ICONS = {
            machinegun: '🔫',
            missile: '🚀',
            laser: '🔦',
            shotgun: '💥',
            plasma: '⚡',
            railgun: '🎯',
            flamethrower: '🔥',
            lightning: '⚡',
            magnet: '🧲',
            maxhp: '❤️',
            vamp: '🩸',
            crit: '💢',
            rapid: '⚡',
            shield: '🛡️',
            expplus: '📈',
            heal: '💚',
            cooldown: '⏱️',
            boom: '💣',
            dash: '🏃',
        };

        function buildUpgradePool() {
            let pool = [];
            for (const w of WEAPON_DEFS) {
                pool.push({
                    name: `获得${w.name}`,
                    desc: w.desc,
                    icon: ICONS[w.key] || '✨',
                    apply: p => {
                        if (!p.weapons.find(ww => ww.key === w.key)) {
                            p.weapons.push({ key: w.key, name: w.name, level: 1, damage: w.baseDamage, fireRate: w.baseFireRate, fireRateBonus: 0, fireTimer: 0, count: 1 });
                        }
                    },
                    onlyIf: p => !p.weapons.find(ww => ww.key === w.key)
                });
                pool.push({
                    name: `${w.name}伤害+20%`,
                    desc: `${w.name}伤害提升20%`,
                    icon: ICONS[w.key],
                    apply: p => {
                        let weapon = p.weapons.find(ww => ww.key === w.key);
                        if (weapon) weapon.damage = Math.floor(weapon.damage * 1.2);
                    },
                    onlyIf: p => !!p.weapons.find(ww => ww.key === w.key)
                });
                pool.push({
                    name: `${w.name}射速+15%`,
                    desc: `${w.name}射速提升15%（冷却减少）`,
                    icon: ICONS[w.key],
                    apply: p => {
                        let weapon = p.weapons.find(ww => ww.key === w.key);
                        if (weapon) weapon.fireRateBonus = Math.min((weapon.fireRateBonus || 0) + 0.15, 0.8);
                    },
                    onlyIf: p => !!p.weapons.find(ww => ww.key === w.key)
                });
                pool.push({
                    name: `${w.name}弹道数量+1`,
                    desc: `${w.name}每次发射弹道数+1`,
                    icon: ICONS[w.key],
                    apply: p => {
                        let weapon = p.weapons.find(ww => ww.key === w.key);
                        if (weapon) weapon.count = (weapon.count || 1) + 1;
                    },
                    onlyIf: p => !!p.weapons.find(ww => ww.key === w.key) && (p.weapons.find(ww => ww.key === w.key).count || 1) < 5
                });
                // 武器吸血
                pool.push({
                    name: `${w.name}能量回收`,
                    desc: `用${w.name}击中敌人时回复5生命（冷却2s）`,
                    icon: ICONS.vamp,
                    apply: p => {
                        let weapon = p.weapons.find(ww => ww.key === w.key);
                        if (weapon) weapon.vamp = true;
                    },
                    onlyIf: p => !!p.weapons.find(ww => ww.key === w.key) && !p.weapons.find(ww => ww.key === w.key).vamp
                });
            }
            pool.push({ name: '磁力收集器', desc: '自动吸取经验球，范围提升', icon: ICONS.magnet, apply: p => { p.magnetRange = (p.magnetRange || 80) + 50; }, onlyIf: () => true });
            pool.push({ name: '装甲强化', desc: '最大生命+25', icon: ICONS.maxhp, apply: p => { p.maxHp = (p.maxHp || 100) + 25; p.hp = Math.min(p.hp + 25, p.maxHp); }, onlyIf: () => true });
            pool.push({ name: '精准打击', desc: '有15%概率造成双倍伤害', icon: ICONS.crit, apply: p => { p.crit = true; }, onlyIf: p => !p.crit });
            pool.push({ name: '超频模式', desc: '短时间内所有武器射速翻倍', icon: ICONS.rapid, apply: p => { p.rapid = 300; }, onlyIf: p => !p.rapid });
            pool.push({ name: '能量护盾', desc: '获得一次可抵挡伤害的护盾', icon: ICONS.shield, apply: p => { p.shield++; }, onlyIf: () => true });
            pool.push({ name: '经验加成', desc: '获得经验时额外+1', icon: ICONS.expplus, apply: p => p.skills.push('expPlus'), onlyIf: p => !p.skills.includes('expPlus') });
            pool.push({ name: '自动修复', desc: '每15秒自动回复10生命', icon: ICONS.heal, apply: p => { p.healAura = true; }, onlyIf: p => !p.healAura });
            pool.push({ name: '系统优化', desc: '所有武器射速永久提升', icon: ICONS.cooldown, apply: p => { for (let w of p.weapons) w.fireRate = Math.max(2, w.fireRate - 3); }, onlyIf: () => true });
            pool.push({ name: '爆炸弹头', desc: '击杀敌人时造成范围爆炸伤害', icon: ICONS.boom, apply: p => { p.boom = true; }, onlyIf: p => !p.boom });
            pool.push({ name: '推进器增压', desc: '短时间内无敌并提升移动速度', icon: ICONS.dash, apply: p => { p.dash = 180; }, onlyIf: p => !p.dash });
            return pool;
        }

        function randomUpgradeChoices(n = 3) {
            let pool = upgradePool.filter(u => u.onlyIf(player) && !lastUpgradeChoices.includes(u));
            if (pool.length < n) pool = upgradePool.filter(u => u.onlyIf(player));
            let arr = [];
            while (arr.length < n) {
                let idx = Math.floor(Math.random() * pool.length);
                if (!arr.includes(pool[idx])) arr.push(pool[idx]);
            }
            lastUpgradeChoices = arr;
            return arr;
        }

        function showUpgradePanel() {
            upgradePanel.style.display = 'block';
            upgradeOptionsDiv.innerHTML = '';
            let choices = randomUpgradeChoices();
            choices.forEach(upg => {
                let div = document.createElement('div');
                div.className = 'upgrade-option';
                div.innerHTML = `<span style="font-size:28px;vertical-align:middle;margin-right:10px;">${upg.icon || '✨'}</span><b>${upg.name}</b><br><small>${upg.desc}</small>`;
                div.onclick = () => {
                    upg.apply(player);
                    if (player.skills.includes('extraExpOnLevel')) exp++;
                    upgradePanel.style.display = 'none';
                    gameState = 'playing';
                    lastFrameTime = performance.now();
                    requestAnimationFrame(gameLoop);
                };
                upgradeOptionsDiv.appendChild(div);
            });
            gameState = 'upgrade';
        }

        function showGameOver() {
            gameOverDiv.style.display = 'block';
            const rankTitle = level <= 5 ? '新手飞行员'
                : level <= 10 ? '熟练飞行员'
                    : level <= 15 ? '王牌飞行员'
                        : level <= 20 ? '传奇飞行员'
                            : level <= 25 ? '空中霸主'
                                : '传说中的战神';
            finalScoreDiv.innerHTML = `
              <div style="font-size:1.4em;margin-bottom:6px;color:#00ffff;">等级：${level}</div>
              <div style="color:#ffaa00;font-size:1.2em;text-shadow:0 0 10px #ffaa00;">【${rankTitle}】</div>
              <div style="font-size:1em;margin-top:4px;color:#88ccff;">积分：${score}</div>
              ${score >= 50000 ? '<button onclick="revive()" style="margin-top:12px;padding:8px 20px;background:linear-gradient(135deg,#ff4444 0%,#ff6666 100%);color:#fff;border:none;border-radius:6px;cursor:pointer;">花50000积分紧急修复！</button>' : ''}
            `;
            gameState = 'over';
        }

        let preGameBuffCount = 0;
        const startPanel = document.getElementById('start-panel');
        const btnEasy = document.getElementById('btn-easy');
        const btnNormal = document.getElementById('btn-normal');
        const btnHard = document.getElementById('btn-hard');
        const btnStart = document.getElementById('btn-start');
        const answerTip = document.getElementById('answer-tip');

        btnEasy.onclick = function () {
            answerTip.textContent = '简单模式：获得2个初始装备选择';
            difficulty = 'easy';
            preGameBuffCount = 2;
            btnStart.disabled = false;
        };
        btnNormal.onclick = function () {
            answerTip.textContent = '普通模式：获得1个初始装备选择';
            difficulty = 'normal';
            preGameBuffCount = 1;
            btnStart.disabled = false;
        };
        btnHard.onclick = function () {
            answerTip.textContent = '困难模式：直接开始，敌人更强！';
            difficulty = 'hard';
            preGameBuffCount = 0;
            btnStart.disabled = false;
        };
        btnStart.onclick = function () {
            startPanel.style.display = 'none';
            resetGame();
            if (preGameBuffCount > 0) {
                showPreGameBuffs(preGameBuffCount);
            } else {
                requestAnimationFrame(gameLoop);
            }
        };

        function showPreGameBuffs(n) {
            if (n <= 0) {
                upgradePanel.style.display = 'none';
                gameState = 'playing';
                requestAnimationFrame(gameLoop);
                return;
            }
            upgradePanel.style.display = 'block';
            upgradeOptionsDiv.innerHTML = '';
            let choices = randomUpgradeChoices();
            choices.forEach(upg => {
                let div = document.createElement('div');
                div.className = 'upgrade-option';
                div.innerHTML = `<span style="font-size:28px;vertical-align:middle;margin-right:10px;">${upg.icon || '✨'}</span><b>${upg.name}</b><br><small>${upg.desc}</small>`;
                div.onclick = () => {
                    upg.apply(player);
                    if (player.skills.includes('extraExpOnLevel')) exp++;
                    upgradePanel.style.display = 'none';
                    showPreGameBuffs(n - 1);
                };
                upgradeOptionsDiv.appendChild(div);
            });
            gameState = 'upgrade';
        }

        // 游戏结束/重开时重置答题面板
        function restartGame() {
            gameOverDiv.style.display = 'none';
            startPanel.style.display = 'flex';
            btnStart.disabled = true;
            answerTip.textContent = '';
            preGameBuffCount = 0;
        }

        // 页面加载时只显示开始面板
        window.addEventListener('DOMContentLoaded', function () {
            startPanel.style.display = 'flex';
            btnStart.disabled = true;
            answerTip.textContent = '';
            preGameBuffCount = 0;
        });

        // 控制
        let keys = {};
        document.addEventListener('keydown', e => { keys[e.key] = true; });
        document.addEventListener('keyup', e => { keys[e.key] = false; });

        // 经验球
        let exps = [];
        function spawnExp(x, y, amount = 1) {
            for (let i = 0; i < amount; i++) {
                exps.push({ 
                    x: x + Math.random() * 30 - 15, 
                    y: y + Math.random() * 30 - 15, 
                    r: 8, 
                    v: 2 + Math.random() * 2, 
                    angle: Math.random() * Math.PI * 2,
                    glow: Math.random() * 50 + 50
                });
            }
        }

        function updateExp() {
            for (let i = exps.length - 1; i >= 0; i--) {
                let e = exps[i];
                // 磁力吸附逻辑
                if (player.magnetRange) {
                    const px = player.x + player.w / 2, py = player.y + player.h / 2;
                    const dx = px - e.x, dy = py - e.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < player.magnetRange) {
                        const speed = 8;
                        e.x += dx / dist * speed;
                        e.y += dy / dist * speed;
                    } else {
                        e.y += e.v;
                    }
                } else {
                    e.y += e.v;
                }
                if (Math.abs(e.x + e.r / 2 - player.x - player.w / 2) < player.w / 2 && Math.abs(e.y + e.r / 2 - player.y - player.h / 2) < player.h / 2) {
                    let add = 1;
                    if (player.skills.includes('expPlus')) add++;
                    exp += add;
                    exps.splice(i, 1);
                    if (exp >= expToLevel) {
                        exp -= expToLevel;
                        level++;
                        expToLevel = Math.floor(10 * Math.pow(1.3, level - 1));
                        showUpgradePanel();
                    }
                } else if (e.y > H + 20) {
                    exps.splice(i, 1);
                }
            }
        }

        // 敌人生成 - 飞机主题
        function spawnEnemy() {
            let t = wave;
            let difficultyMult = difficulty === 'easy' ? 0.8 : difficulty === 'hard' ? 1.5 : 1.0;
            let type = 'fighter';
            let hp = Math.floor((30 + t * 8) * difficultyMult);
            let speed = (1.5 + t * 0.1) * difficultyMult;
            let color = '#ff4444';
            let size = { w: 40, h: 40 };

            if (t > 3 && Math.random() < 0.25) { 
                type = 'bomber'; 
                hp = Math.floor(hp * 1.8); 
                speed *= 0.7; 
                color = '#ff8800'; 
                size = { w: 60, h: 50 };
            }
            if (t > 5 && Math.random() < 0.15) { 
                type = 'interceptor'; 
                speed *= 2; 
                color = '#00ff88'; 
                size = { w: 35, h: 35 };
            }
            if (t > 8 && Math.random() < 0.1) { 
                type = 'gunship'; 
                hp = Math.floor(hp * 2.5); 
                color = '#8844ff'; 
                size = { w: 70, h: 60 };
            }
            if (t > 12 && Math.random() < 0.08) { 
                type = 'boss'; 
                hp = Math.floor(hp * 4); 
                speed *= 0.8; 
                color = '#ff00ff'; 
                size = { w: 100, h: 80 };
            }

            let x = Math.random() * (W - size.w);
            enemies.push({ 
                x, y: -size.h, 
                w: size.w, h: size.h, 
                hp, maxHp: hp, 
                speed, type, color,
                fireTimer: 0,
                movePattern: Math.random() < 0.3 ? 'zigzag' : 'straight',
                zigzagDir: Math.random() < 0.5 ? -1 : 1
            });
        }

        function spawnBoss() {
            bossActive = true;
            let difficultyMult = difficulty === 'easy' ? 0.7 : difficulty === 'hard' ? 1.8 : 1.0;
            let hp = Math.floor((300 + wave * 50) * difficultyMult);
            enemies.push({ 
                x: W / 2 - 75, y: -150, 
                w: 150, h: 120, 
                hp, maxHp: hp, 
                speed: 1.2, 
                type: 'megaboss', 
                color: '#ff0088',
                fireTimer: 0,
                movePattern: 'boss',
                phase: 1
            });
        }

        // 多武器自动射击
        function fireWeapons(delta) {
            for (const w of player.weapons) {
                w.fireTimer -= delta;
                if (w.fireTimer <= 0) {
                    let def = getWeaponDef(w.key);
                    let count = w.count || 1;
                    
                    if (def.type === 'line') {
                        for (let c = 0; c < count; c++) {
                            let offset = (c - (count - 1) / 2) * 20;
                            bullets.push({ 
                                x: player.x + player.w / 2 - 3 + offset, 
                                y: player.y - 10, 
                                w: 6, h: 20, 
                                dx: 0, dy: -12 - w.level, 
                                damage: w.damage, 
                                color: def.color, 
                                effect: 'line', 
                                level: w.level, 
                                life: 0, 
                                owner: w.key, 
                                vamp: w.vamp 
                            });
                        }
                    } else if (def.type === 'spread') {
                        let spread = 25 + 5 * w.level;
                        let cnt = (3 + Math.floor(w.level / 2)) * count;
                        for (let i = 0; i < cnt; i++) {
                            let angle = (-(cnt - 1) / 2 + i) * spread * Math.PI / 180;
                            let dx = Math.sin(angle) * 8, dy = -Math.cos(angle) * 8;
                            bullets.push({ 
                                x: player.x + player.w / 2 - 4, 
                                y: player.y - 10, 
                                w: 8, h: 16, 
                                dx, dy, 
                                damage: w.damage, 
                                color: def.color, 
                                effect: 'spread', 
                                level: w.level, 
                                life: 0, 
                                owner: w.key, 
                                vamp: w.vamp 
                            });
                        }
                    } else if (def.type === 'laser') {
                        for (let c = 0; c < count; c++) {
                            let offset = (c - (count - 1) / 2) * 20;
                            bullets.push({ 
                                x: player.x + player.w / 2 - 2 + offset, 
                                y: 0, 
                                w: 4, h: player.y + player.h / 2, 
                                dx: 0, dy: 0, 
                                damage: w.damage, 
                                color: def.color, 
                                effect: 'laser', 
                                level: w.level, 
                                life: 0, 
                                owner: w.key, 
                                duration: 15 + 3 * w.level, 
                                vamp: w.vamp 
                            });
                        }
                    } else if (def.type === 'missile') {
                        for (let c = 0; c < count; c++) {
                            let target = null;
                            let minDist = 999999;
                            for (let e of enemies) {
                                let dist = Math.hypot(e.x + e.w/2 - player.x - player.w/2, e.y + e.h/2 - player.y - player.h/2);
                                if (dist < minDist) {
                                    minDist = dist;
                                    target = e;
                                }
                            }
                            bullets.push({
                                x: player.x + player.w / 2 - 6,
                                y: player.y - 10,
                                w: 12, h: 24,
                                dx: 0, dy: -6,
                                damage: w.damage,
                                color: def.color,
                                effect: 'missile',
                                level: w.level,
                                life: 0,
                                owner: w.key,
                                target: target,
                                speed: 8 + w.level,
                                vamp: w.vamp
                            });
                        }
                    } else if (def.type === 'plasma') {
                        for (let c = 0; c < count; c++) {
                            let offset = (c - (count - 1) / 2) * 20;
                            bullets.push({
                                x: player.x + player.w / 2 - 8 + offset,
                                y: player.y - 10,
                                w: 16, h: 16,
                                dx: 0, dy: -10 - w.level,
                                damage: w.damage,
                                color: def.color,
                                effect: 'plasma',
                                level: w.level,
                                life: 0,
                                owner: w.key,
                                penetrate: 2 + w.level,
                                vamp: w.vamp
                            });
                        }
                    } else if (def.type === 'railgun') {
                        for (let c = 0; c < count; c++) {
                            let offset = (c - (count - 1) / 2) * 25;
                            bullets.push({
                                x: player.x + player.w / 2 - 1 + offset,
                                y: 0,
                                w: 2, h: H,
                                dx: 0, dy: 0,
                                damage: w.damage,
                                color: def.color,
                                effect: 'railgun',
                                level: w.level,
                                life: 0,
                                owner: w.key,
                                duration: 8,
                                vamp: w.vamp
                            });
                        }
                    } else if (def.type === 'flame') {
                        for (let c = 0; c < count; c++) {
                            let offset = (c - (count - 1) / 2) * 15;
                            bullets.push({
                                x: player.x + player.w / 2 - 15 + offset,
                                y: player.y - 20,
                                w: 30, h: 40,
                                dx: 0, dy: -4,
                                damage: w.damage,
                                color: def.color,
                                effect: 'flame',
                                level: w.level,
                                life: 0,
                                owner: w.key,
                                duration: 20 + w.level * 5,
                                vamp: w.vamp
                            });
                        }
                    } else if (def.type === 'chainlight') {
                        for (let c = 0; c < count; c++) {
                            let startX = player.x + player.w / 2, startY = player.y;
                            let chainTargets = [];
                            let lastX = startX, lastY = startY;
                            let remain = 3 + w.level;
                            let hitSet = new Set();
                            
                            while (remain-- > 0) {
                                let minDist = 9999, minIdx = -1;
                                for (let i = 0; i < enemies.length; i++) {
                                    if (hitSet.has(i)) continue;
                                    let e = enemies[i];
                                    let dx = e.x + e.w / 2 - lastX, dy = e.y + e.h / 2 - lastY;
                                    let dist = Math.sqrt(dx * dx + dy * dy);
                                    if (dist < minDist && dist < 250) {
                                        minDist = dist;
                                        minIdx = i;
                                    }
                                }
                                if (minIdx >= 0) {
                                    let e = enemies[minIdx];
                                    chainTargets.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, idx: minIdx });
                                    hitSet.add(minIdx);
                                    lastX = e.x + e.w / 2;
                                    lastY = e.y + e.h / 2;
                                } else {
                                    break;
                                }
                            }
                            
                            if (chainTargets.length > 0) {
                                bullets.push({
                                    x: startX, y: startY,
                                    chain: chainTargets,
                                    damage: w.damage,
                                    color: def.color,
                                    effect: 'chainlight',
                                    level: w.level,
                                    life: 0,
                                    owner: w.key,
                                    vamp: w.vamp
                                });
                            }
                        }
                    }
                    
                    let bonus = (w.fireRateBonus || 0);
                    let rapidMult = player.rapid > 0 ? 2 : 1;
                    w.fireTimer = Math.max(1, w.fireRate / (1 + bonus) / rapidMult);
                }
            }
        }

        // 绘制星空背景
        let stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                speed: 1 + Math.random() * 3,
                size: Math.random() * 2 + 1,
                brightness: Math.random()
            });
        }

        function drawBackground() {
            // 星空背景
            for (let star of stars) {
                star.y += star.speed;
                if (star.y > H) {
                    star.y = -5;
                    star.x = Math.random() * W;
                }
                
                ctx.save();
                ctx.globalAlpha = 0.5 + star.brightness * 0.5;
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = star.size * 2;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, 2 * Math.PI);
                ctx.fill();
                ctx.restore();
            }

            // 远景行星
            ctx.save();
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = '#4488ff';
            ctx.beginPath();
            ctx.arc(W + 50, H / 3, 80, 0, 2 * Math.PI);
            ctx.fill();
            ctx.restore();
        }

        // 游戏主循环
        document.addEventListener('visibilitychange', () => { if (document.hidden && gameState === 'playing') gameState = 'pause'; });
        
        function gameLoop(now) {
            if (gameState === 'over') return;
            if (gameState === 'pause') { requestAnimationFrame(gameLoop); return; }
            if (gameState === 'upgrade') return;
            
            let delta = (now - lastFrameTime) / 16.67;
            lastFrameTime = now;
            
            // 背景
            ctx.fillStyle = 'linear-gradient(180deg, #001133 0%, #002244 30%, #003355 70%, #004466 100%)';
            ctx.fillRect(0, 0, W, H);
            
            drawBackground();
            
            // 玩家战机绘制
            ctx.save();
            // 机身
            ctx.fillStyle = '#00aaff';
            ctx.fillRect(player.x + player.w/2 - 8, player.y + 10, 16, 30);
            // 机翼
            ctx.fillStyle = '#0088cc';
            ctx.fillRect(player.x + 5, player.y + 20, 40, 8);
            // 驾驶舱
            ctx.fillStyle = '#88ccff';
            ctx.fillRect(player.x + player.w/2 - 6, player.y + 5, 12, 15);
            // 引擎光效
            if (keys['ArrowUp'] || keys['w'] || keys['ArrowDown'] || keys['s'] || keys['ArrowLeft'] || keys['a'] || keys['ArrowRight'] || keys['d']) {
                ctx.save();
                ctx.globalAlpha = 0.8;
                ctx.fillStyle = '#ffaa00';
                ctx.shadowColor = '#ffaa00';
                ctx.shadowBlur = 15;
                ctx.fillRect(player.x + player.w/2 - 4, player.y + 40, 8, 12);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(player.x + player.w/2 - 2, player.y + 42, 4, 8);
                ctx.restore();
            }
            ctx.restore();
            
            // 玩家血条
            ctx.save();
            let barW = player.w, barH = 6;
            let px = player.x, py = player.y + player.h + 8;
            ctx.fillStyle = '#333';
            ctx.fillRect(px, py, barW, barH);
            ctx.fillStyle = player.hp > player.maxHp * 0.3 ? '#00ff00' : '#ff4444';
            ctx.fillRect(px, py, barW * (player.hp / player.maxHp), barH);
            ctx.strokeStyle = '#fff'; 
            ctx.strokeRect(px, py, barW, barH);
            ctx.font = '10px Arial';
            ctx.fillStyle = '#fff';
            ctx.fillText(`${Math.floor(player.hp)}/${player.maxHp}`, px + 2, py + barH - 1);
            ctx.restore();
            
            // 玩家无敌闪烁
            if (player.invincible > 0) {
                ctx.globalAlpha = 0.5 + 0.5 * Math.sin(Date.now() / 80);
                ctx.fillStyle = '#00ffff';
                ctx.beginPath(); 
                ctx.arc(player.x + player.w / 2, player.y + player.h / 2, player.w / 2 + 6, 0, 2 * Math.PI); 
                ctx.fill();
                ctx.globalAlpha = 1;
                player.invincible--;
            }
            
            // 护盾UI提示
            if (player.shield > 0) {
                ctx.save();
                ctx.globalAlpha = 0.6 + 0.4 * Math.sin(Date.now() / 120);
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(player.x + player.w / 2, player.y + player.h / 2, player.w / 2 + 10, 0, 2 * Math.PI);
                ctx.stroke();
                ctx.restore();
            }
            
            // 玩家移动
            if (gameState === 'playing') {
                let move = player.speed * delta;
                if (player.dash > 0) move *= 1.8;
                if (keys['ArrowLeft'] || keys['a']) player.x = Math.max(0, player.x - move);
                if (keys['ArrowRight'] || keys['d']) player.x = Math.min(W - player.w, player.x + move);
                if (keys['ArrowUp'] || keys['w']) player.y = Math.max(0, player.y - move);
                if (keys['ArrowDown'] || keys['s']) player.y = Math.min(H - player.h, player.y + move);
                
                if (player.dash > 0) {
                    player.dash--;
                    player.invincible = Math.max(player.invincible, 5);
                }
                if (player.rapid > 0) player.rapid--;
            }
            
            // 多武器自动射击
            fireWeapons(delta);
            
            // 子弹更新和绘制
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.life++;
                
                // 导弹追踪逻辑
                if (b.effect === 'missile' && b.target && enemies.includes(b.target)) {
                    let tx = b.target.x + b.target.w / 2;
                    let ty = b.target.y + b.target.h / 2;
                    let dx = tx - (b.x + b.w / 2);
                    let dy = ty - (b.y + b.h / 2);
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 0) {
                        b.dx = (dx / dist) * b.speed * 0.3 + b.dx * 0.7;
                        b.dy = (dy / dist) * b.speed * 0.3 + b.dy * 0.7;
                    }
                }
                
                b.x += b.dx * delta;
                b.y += b.dy * delta;
                
                // 子弹绘制
                if (b.effect === 'laser') {
                    ctx.save();
                    ctx.globalAlpha = 0.8;
                    ctx.shadowColor = b.color;
                    ctx.shadowBlur = 20;
                    ctx.strokeStyle = b.color;
                    ctx.lineWidth = 8;
                    ctx.beginPath();
                    ctx.moveTo(b.x + b.w / 2, player.y + player.h / 2);
                    ctx.lineTo(b.x + b.w / 2, 0);
                    ctx.stroke();
                    ctx.restore();
                } else if (b.effect === 'railgun') {
                    ctx.save();
                    ctx.globalAlpha = 0.9;
                    ctx.shadowColor = b.color;
                    ctx.shadowBlur = 25;
                    ctx.strokeStyle = b.color;
                    ctx.lineWidth = 12;
                    ctx.beginPath();
                    ctx.moveTo(b.x + b.w / 2, 0);
                    ctx.lineTo(b.x + b.w / 2, H);
                    ctx.stroke();
                    // 内核
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    ctx.restore();
                } else if (b.effect === 'flame') {
                    ctx.save();
                    ctx.globalAlpha = 0.7;
                    let grad = ctx.createRadialGradient(b.x + b.w/2, b.y + b.h/2, 5, b.x + b.w/2, b.y + b.h/2, b.w/2);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.3, '#ffaa00');
                    grad.addColorStop(0.7, '#ff4400');
                    grad.addColorStop(1, 'rgba(255,68,0,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.ellipse(b.x + b.w/2, b.y + b.h/2, b.w/2, b.h/2, 0, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.restore();
                } else if (b.effect === 'chainlight' && b.chain) {
                    ctx.save();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 8;
                    ctx.shadowColor = b.color;
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.moveTo(b.x, b.y);
                    for (let t of b.chain) {
                        let offx = t.x + (Math.random() - 0.5) * 10;
                        let offy = t.y + (Math.random() - 0.5) * 10;
                        ctx.lineTo(offx, offy);
                    }
                    ctx.stroke();
                    ctx.restore();
                } else if (b.effect === 'missile') {
                    // 导弹绘制
                    ctx.save();
                    ctx.translate(b.x + b.w/2, b.y + b.h/2);
                    ctx.rotate(Math.atan2(b.dy, b.dx) + Math.PI/2);
                    ctx.fillStyle = b.color;
                    ctx.fillRect(-6, -12, 12, 24);
                    ctx.fillStyle = '#ffaa00';
                    ctx.fillRect(-3, -8, 6, 16);
                    // 尾焰
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(-2, 12, 4, 8);
                    ctx.restore();
                } else {
                    // 普通子弹
                    ctx.save(); 
                    ctx.shadowColor = b.color; 
                    ctx.shadowBlur = 10; 
                    ctx.fillStyle = b.color;
                    ctx.beginPath(); 
                    ctx.arc(b.x + b.w / 2, b.y + b.h / 2, b.w / 2, 0, 2 * Math.PI); 
                    ctx.fill(); 
                    ctx.restore();
                }
                
                // 子弹碰撞检测
                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (!e) continue;
                    
                    let collision = false;
                    if (b.effect === 'laser' || b.effect === 'railgun') {
                        collision = e.x < b.x + b.w && e.x + e.w > b.x && e.y < H && e.y + e.h > 0;
                    } else if (b.effect === 'flame') {
                        let dx = (e.x + e.w/2) - (b.x + b.w/2);
                        let dy = (e.y + e.h/2) - (b.y + b.h/2);
                        collision = Math.sqrt(dx*dx + dy*dy) < (b.w + e.w)/2;
                    } else if (b.effect === 'chainlight' && b.chain) {
                        for (let t of b.chain) {
                            if (t.idx === j) {
                                collision = true;
                                break;
                            }
                        }
                    } else {
                        collision = b.x + b.w > e.x && b.x < e.x + e.w && b.y + b.h > e.y && b.y < e.y + e.h;
                    }
                    
                    if (collision) {
                        let damage = b.damage;
                        if (player.crit && Math.random() < 0.15) damage *= 2;
                        
                        // 吸血判定
                        if (b.vamp && vampCooldown <= 0 && player.hp < player.maxHp) {
                            player.hp = Math.min(player.maxHp, player.hp + 5);
                            vampCooldown = 120;
                        }
                        
                        e.hp -= damage;
                        e.hitFlash = 5;
                        showDamage(e.x + e.w / 2, e.y, Math.floor(damage));
                        
                        if (b.effect !== 'laser' && b.effect !== 'railgun' && b.effect !== 'flame' && b.effect !== 'chainlight') {
                            if (b.effect === 'plasma' && b.penetrate > 0) {
                                b.penetrate--;
                                if (b.penetrate <= 0) hit = true;
                            } else {
                                hit = true;
                            }
                        }
                        break;
                    }
                }
                
                // 子弹生命周期管理
                if (b.effect === 'laser' || b.effect === 'railgun') {
                    b.duration--;
                    if (b.duration <= 0) hit = true;
                } else if (b.effect === 'flame') {
                    b.duration--;
                    if (b.duration <= 0) hit = true;
                } else if (b.effect === 'chainlight') {
                    if (b.life > 15) hit = true;
                }
                
                if (b.y < -50 || b.x < -50 || b.x > W + 50 || hit || b.life > 180) {
                    bullets.splice(i, 1);
                }
            }
            
            if (vampCooldown > 0) vampCooldown--;
            
            // 敌人更新
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                if (!e) continue;
                
                // 敌人移动模式
                if (e.movePattern === 'zigzag') {
                    e.x += e.zigzagDir * 2 * delta;
                    if (e.x <= 0 || e.x >= W - e.w) e.zigzagDir *= -1;
                }
                e.y += e.speed * delta;
                
                // 敌人射击
                e.fireTimer -= delta;
                if (e.fireTimer <= 0 && e.y > 0 && e.y < H - 100) {
                    if (e.type === 'bomber' || e.type === 'gunship' || e.type === 'boss' || e.type === 'megaboss') {
                        let shots = e.type === 'megaboss' ? 5 : e.type === 'gunship' ? 3 : 1;
                        for (let s = 0; s < shots; s++) {
                            let angle = Math.atan2(player.y - e.y, player.x - e.x) + (s - (shots-1)/2) * 0.3;
                            enemyBullets.push({
                                x: e.x + e.w/2 - 4,
                                y: e.y + e.h,
                                w: 8, h: 12,
                                dx: Math.cos(angle) * 4,
                                dy: Math.sin(angle) * 4,
                                damage: 15 + wave * 2
                            });
                        }
                    }
                    e.fireTimer = (e.type === 'interceptor' ? 180 : e.type === 'megaboss' ? 30 : 60) + Math.random() * 30;
                }
                
                // 敌人绘制
                ctx.save();
                if (e.type === 'fighter') {
                    ctx.fillStyle = e.color;
                    ctx.fillRect(e.x + e.w/2 - 6, e.y, 12, 25);
                    ctx.fillRect(e.x + 5, e.y + 10, e.w - 10, 8);
                } else if (e.type === 'bomber') {
                    ctx.fillStyle = e.color;
                    ctx.fillRect(e.x, e.y + 10, e.w, 20);
                    ctx.fillRect(e.x + 10, e.y, e.w - 20, 40);
                } else if (e.type === 'interceptor') {
                    ctx.fillStyle = e.color;
                    ctx.beginPath();
                    ctx.moveTo(e.x + e.w/2, e.y);
                    ctx.lineTo(e.x, e.y + e.h);
                    ctx.lineTo(e.x + e.w, e.y + e.h);
                    ctx.closePath();
                    ctx.fill();
                } else if (e.type === 'gunship') {
                    ctx.fillStyle = e.color;
                    ctx.fillRect(e.x, e.y, e.w, e.h);
                    ctx.fillStyle = '#ff4444';
                    ctx.fillRect(e.x + 10, e.y + 10, e.w - 20, e.h - 20);
                } else if (e.type === 'boss' || e.type === 'megaboss') {
                    ctx.fillStyle = e.color;
                    ctx.fillRect(e.x, e.y, e.w, e.h);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 16px Arial';
                    ctx.fillText('BOSS', e.x + e.w/2 - 20, e.y + e.h/2 + 5);
                }
                ctx.restore();
                
                // 敌人血条
                ctx.fillStyle = '#333';
                ctx.fillRect(e.x, e.y - 8, e.w, 4);
                ctx.fillStyle = e.hp > e.maxHp * 0.3 ? '#ff4444' : '#ff0000';
                ctx.fillRect(e.x, e.y - 8, e.w * e.hp / e.maxHp, 4);
                
                // 敌人受击闪烁
                if (e.hitFlash && e.hitFlash > 0) {
                    ctx.save();
                    ctx.globalAlpha = 0.7;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(e.x - 2, e.y - 2, e.w + 4, e.h + 4);
                    ctx.restore();
                    e.hitFlash--;
                }
                
                // 敌人死亡
                if (e.hp <= 0) {
                    // 爆炸粒子效果
                    for (let p = 0; p < 15; p++) {
                        let angle = Math.random() * Math.PI * 2;
                        let speed = 2 + Math.random() * 4;
                        particles.push({
                            x: e.x + e.w / 2,
                            y: e.y + e.h / 2,
                            dx: Math.cos(angle) * speed,
                            dy: Math.sin(angle) * speed,
                            r: 2 + Math.random() * 3,
                            color: ['#ff4444', '#ffaa00', '#ffffff'][Math.floor(Math.random() * 3)],
                            life: 20 + Math.random() * 15,
                            maxLife: 20 + Math.random() * 15
                        });
                    }
                    
                    let expAmount = e.type === 'megaboss' ? 50 : e.type === 'boss' ? 25 : e.type === 'gunship' ? 8 : 3;
                    spawnExp(e.x + e.w / 2, e.y + e.h / 2, expAmount);
                    
                    if (e.type === 'boss' || e.type === 'megaboss') bossActive = false;
                    enemies.splice(i, 1);
                    
                    let scoreGain = e.type === 'megaboss' ? 1000 : e.type === 'boss' ? 500 : e.type === 'gunship' ? 150 : e.type === 'bomber' ? 80 : 50;
                    score += scoreGain;
                    
                    // 爆炸弹头效果
                    if (player.boom) {
                        for (let j = enemies.length - 1; j >= 0; j--) {
                            let other = enemies[j];
                            let dist = Math.hypot(other.x + other.w/2 - e.x - e.w/2, other.y + other.h/2 - e.y - e.h/2);
                            if (dist < 80) {
                                other.hp -= 30;
                                other.hitFlash = 5;
                            }
                        }
                    }
                } else if (e.y > H + 20) {
                    enemies.splice(i, 1);
                    if (player.shield > 0) {
                        player.shield--;
                    } else if (!player.invincible) {
                        player.hp -= 10;
                        player.invincible = 90;
                        hpFlashTimer = 30;
                    }
                }
            }
            
            // 敌人子弹
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let b = enemyBullets[i];
                b.x += b.dx * delta;
                b.y += b.dy * delta;
                
                ctx.save();
                ctx.fillStyle = '#ffff00';
                ctx.shadowColor = '#ffff00';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(b.x + b.w/2, b.y + b.h/2, b.w/2, 0, 2 * Math.PI);
                ctx.fill();
                ctx.restore();
                
                if (b.x + b.w > player.x && b.x < player.x + player.w && b.y + b.h > player.y && b.y < player.y + player.h) {
                    if (player.invincible <= 0) {
                        if (player.shield > 0) {
                            player.shield--;
                        } else {
                            player.hp -= b.damage;
                            player.invincible = 60;
                            hpFlashTimer = 20;
                        }
                    }
                    enemyBullets.splice(i, 1);
                } else if (b.y > H + 20 || b.x < -20 || b.x > W + 20) {
                    enemyBullets.splice(i, 1);
                }
            }
            
            // 经验球更新
            updateExp();
            for (let e of exps) {
                ctx.save();
                ctx.globalAlpha = 0.8 + 0.2 * Math.sin(Date.now() / 100);
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = e.glow / 10;
                ctx.beginPath(); 
                ctx.arc(e.x, e.y, e.r, 0, 2 * Math.PI); 
                ctx.fillStyle = '#00ffff'; 
                ctx.fill(); 
                ctx.strokeStyle = '#ffffff'; 
                ctx.stroke();
                ctx.restore();
            }
            
            // 粒子系统
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx * delta; 
                p.y += p.dy * delta; 
                p.life--;
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 5;
                ctx.beginPath(); 
                ctx.arc(p.x, p.y, p.r, 0, 2 * Math.PI); 
                ctx.fill(); 
                ctx.globalAlpha = 1;
                if (p.life <= 0) particles.splice(i, 1);
            }
            
            // UI更新
            scoreSpan.textContent = `积分: ${score}`;
            levelSpan.textContent = `等级: ${level}`;
            expSpan.textContent = `经验: ${exp}/${expToLevel}`;
            waveSpan.textContent = `波次: ${wave}`;
            hpSpan.textContent = `生命: ${Math.floor(player.hp)}/${player.maxHp}`;
            
            if (hpFlashTimer > 0) {
                hpFlashTimer--;
                hpSpan.style.color = hpFlashTimer % 10 < 5 ? '#ff4444' : '#00ffff';
            } else {
                hpSpan.style.color = '#00ffff';
            }
            
            // 武器参数栏
            weaponContent.innerHTML = player.weapons.map(w => {
                let def = getWeaponDef(w.key);
                let crit = player.crit ? '15%' : '0%';
                let vamp = w.vamp ? '有' : '无';
                let heal = player.healAura ? '有' : '无';
                let rapid = player.rapid ? '有' : '无';
                let expplus = player.skills && player.skills.includes('expPlus') ? '有' : '无';
                let fireRateShow = (w.fireRate / (1 + (w.fireRateBonus || 0))).toFixed(1);
                let fireRateBonusShow = ((w.fireRateBonus || 0) * 100).toFixed(0) + '%';
                return `<div style="margin:0 0 8px 0;padding:6px;border-radius:8px;background:rgba(0,50,100,0.8);border:1px solid #0088ff;display:block;width:100%;">
                    <div style="font-size:16px;font-weight:bold;margin-bottom:4px;color:#00ffff;"><span style="font-size:18px;vertical-align:middle;">${ICONS[w.key] || '✨'}</span> ${w.name}</div>
                    <div style="font-size:11px;line-height:1.3;color:#88ccff;">
                        <div>伤害:<b style="color:#ffaa00">${w.damage}</b> 射速:<b style="color:#00ff88">${fireRateShow}</b> <span title='射速加成' style='color:#00ffff'>+${fireRateBonusShow}</span> 弹道:<b style="color:#ff88aa">${w.count || 1}</b></div>
                        <div>暴击:<b style="color:#ffff00">${crit}</b> 吸血:<b style="color:#ff4488">${vamp}</b></div>
                        <div>回血:<b style="color:#44ff88">${heal}</b> 连射:<b style="color:#ff8844">${rapid}</b> 经验:<b style="color:#8844ff">${expplus}</b></div>
                    </div>
                </div>`;
            }).join('');
            
            // 实时调试信息
            const fps = Math.round(1000 / ((now - lastFrameTime) || 16.67));
            const totalEnt = enemies.length + bullets.length + particles.length;
            weaponContent.innerHTML += `
            <div style="margin-top:6px;padding:4px 6px;background:#000;color:#00ff00;font-family:monospace;font-size:10px;border-radius:4px;">
              FPS:${fps} | ENT:${totalEnt} | RAPID:${Math.ceil(player.rapid / 60)}s | DIFF:${difficulty.toUpperCase()}
            </div>`;
            
            // 自动回血
            if (player.healAura) {
                if (!player.healTimer) player.healTimer = 0;
                player.healTimer++;
                if (player.healTimer >= 900) { // 15秒
                    player.hp = Math.min(player.maxHp, player.hp + 10);
                    player.healTimer = 0;
                }
            }
            
            // 波次与Boss生成
            if (gameState === 'playing') {
                let maxEnemies = Math.min(12 + wave, 25);
                if (difficulty === 'easy') maxEnemies = Math.floor(maxEnemies * 0.7);
                if (difficulty === 'hard') maxEnemies = Math.floor(maxEnemies * 1.4);
                
                if (enemies.length < maxEnemies) {
                    if (wave % 10 === 0 && enemies.filter(e => e.type !== 'megaboss').length === 0) {
                        spawnBoss();
                    } else if (wave >= 5 && wave % 5 === 0 && enemies.length === 0 && !bossActive) {
                        for (let i = 0; i < wave; i++) setTimeout(spawnEnemy, i * 300);
                    } else if (Math.random() < 0.03 * delta) {
                        spawnEnemy();
                    }
                }
                if (score > wave * 1000) wave++;
            }
            
            if (player.hp <= 0) {
                showGameOver();
                return;
            }
            
            requestAnimationFrame(gameLoop);
        }

        // 判断是否为移动端
        function isMobile() {
            return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        }
        if (isMobile()) {
            document.getElementById('virtual-joystick').style.display = 'block';
        }

        // 虚拟方向键滑动逻辑
        const vj = document.getElementById('virtual-joystick');
        const vjBtns = document.querySelectorAll('.vj-btn');
        let vjActiveDir = null;

        function getDirFromTouch(touch) {
            for (const btn of vjBtns) {
                const rect = btn.getBoundingClientRect();
                if (
                    touch.clientX >= rect.left &&
                    touch.clientX <= rect.right &&
                    touch.clientY >= rect.top &&
                    touch.clientY <= rect.bottom
                ) {
                    return btn.getAttribute('data-dir');
                }
            }
            return null;
        }

        vj.addEventListener('touchstart', function (e) {
            const dir = getDirFromTouch(e.touches[0]);
            if (dir) {
                vjActiveDir = dir;
                keys[dirToKey(dir)] = true;
                updateVjActive();
            }
            e.preventDefault();
        }, { passive: false });

        vj.addEventListener('touchmove', function (e) {
            const dir = getDirFromTouch(e.touches[0]);
            if (dir !== vjActiveDir) {
                if (vjActiveDir) keys[dirToKey(vjActiveDir)] = false;
                if (dir) keys[dirToKey(dir)] = true;
                vjActiveDir = dir;
                updateVjActive();
            }
            e.preventDefault();
        }, { passive: false });

        vj.addEventListener('touchend', function (e) {
            if (vjActiveDir) keys[dirToKey(vjActiveDir)] = false;
            vjActiveDir = null;
            updateVjActive();
            e.preventDefault();
        }, { passive: false });

        function dirToKey(dir) {
            switch (dir) {
                case 'up': return 'ArrowUp';
                case 'down': return 'ArrowDown';
                case 'left': return 'ArrowLeft';
                case 'right': return 'ArrowRight';
            }
        }

        function updateVjActive() {
            vjBtns.forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-dir') === vjActiveDir);
            });
        }

        resetGame();
        requestAnimationFrame(gameLoop);

        // 复活功能
        function revive() {
            if (score >= 50000) {
                score -= 50000;
                player.hp = player.maxHp;
                gameOverDiv.style.display = 'none';
                gameState = 'playing';
                lastFrameTime = performance.now();
                requestAnimationFrame(gameLoop);
            }
        }

        // 伤害数字显示
        function showDamage(x, y, dmg) {
            const canvas = document.getElementById('game-canvas');
            const container = document.getElementById('game-container');
            const rect = canvas.getBoundingClientRect();
            const crect = container.getBoundingClientRect();

            const relX = x + rect.left - crect.left;
            const relY = y + rect.top - crect.top;

            const span = document.createElement('div');
            span.textContent = '-' + dmg;
            span.style.cssText = `
                position:absolute;
                left:${relX - 24}px;
                top:${relY - 32}px;
                color:#00ffff;
                font-weight:bold;
                font-size:24px;
                pointer-events:none;
                animation:pop 1s forwards;
                z-index:99;
                text-shadow:0 0 8px #00ffff,0 0 2px #000,2px 2px 0 #000;
                filter:drop-shadow(0 0 6px #00ffff);
                user-select:none;
            `;
            container.appendChild(span);
            setTimeout(() => span.remove(), 1000);
        }
    </script>
</body>

</html>

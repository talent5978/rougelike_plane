<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法学院冒险记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .logo {
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .title {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2em;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .form-container {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            min-width: 120px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #764ba2, #667eea);
        }

        .toggle-form {
            margin-top: 20px;
            cursor: pointer;
            text-decoration: underline;
            opacity: 0.8;
        }

        .toggle-form:hover {
            opacity: 1;
        }

        .features {
            margin-top: 30px;
            text-align: left;
        }

        .features h3 {
            margin-bottom: 15px;
            text-align: center;
            color: #4ecdc4;
        }

        .features ul {
            list-style: none;
            padding: 0;
        }

        .features li {
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .features li:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .features li::before {
            content: "✨ ";
            margin-right: 10px;
        }

        .error {
            color: #ff6b6b;
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 107, 107, 0.2);
            border-radius: 8px;
            display: none;
        }

        .success {
            color: #4ecdc4;
            margin-top: 10px;
            padding: 10px;
            background: rgba(78, 205, 196, 0.2);
            border-radius: 8px;
            display: none;
        }

        .loading {
            display: none;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #4ecdc4;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏰</div>
        <h1 class="title">魔法学院冒险记</h1>
        <p class="subtitle">踏上奇幻的冒险之旅</p>

        <div id="start-form" class="form-container">
            <div class="form-group">
                <label for="player-name">角色名称</label>
                <input type="text" id="player-name" placeholder="请输入你的魔法师名字" required maxlength="10">
            </div>
            <button class="btn" onclick="startGame()">开始冒险</button>
            <p style="margin-top: 15px; opacity: 0.8; font-size: 0.9em;">
                💡 提示：无需注册，直接开始游戏！
            </p>
        </div>

        <div class="loading">
            <div class="spinner"></div>
            <p>正在连接魔法学院...</p>
        </div>

        <div class="error" id="error-message"></div>
        <div class="success" id="success-message"></div>

        <div class="features">
            <h3>🎮 游戏特色</h3>
            <ul>
                <li>回合制战斗系统，策略性十足</li>
                <li>丰富的技能和装备系统</li>
                <li>多样化的怪物和Boss挑战</li>
                <li>完整的成长和升级体验</li>
                <li>任务系统和成就收集</li>
                <li>实时排行榜竞技</li>
            </ul>
        </div>
    </div>

    <script>
        function showLoading() {
            document.querySelector('.loading').style.display = 'block';
        }

        function hideLoading() {
            document.querySelector('.loading').style.display = 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
        }

        function clearMessages() {
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('success-message').style.display = 'none';
        }

        // 创建默认玩家数据
        function createPlayer(name) {
            return {
                username: name,
                level: 1,
                exp: 0,
                expToNext: 100,
                hp: 100,
                maxHp: 100,
                mana: 50,
                maxMana: 50,
                attack: 10,
                defense: 5,
                gold: 100,
                inventory: [
                    { id: 1, count: 5 }, // 5个生命药水
                    { id: 2, count: 3 }  // 3个魔法药水
                ],
                equipment: {
                    weapon: null,
                    armor: null
                },
                skills: [1, 2], // 默认技能：火球术和治疗术
                achievements: [],
                stats: {
                    monstersKilled: 0,
                    questsCompleted: 0,
                    totalDamageDealt: 0,
                    totalGoldEarned: 0
                },
                battleState: null,
                createdAt: new Date(),
                lastLogin: new Date()
            };
        }

        function startGame() {
            const playerName = document.getElementById('player-name').value.trim();

            if (!playerName) {
                showError('请输入你的魔法师名字');
                return;
            }

            if (playerName.length > 10) {
                showError('名字太长了，请控制在10个字符以内');
                return;
            }

            showLoading();
            clearMessages();

            // 创建玩家数据并保存到本地存储
            const player = createPlayer(playerName);
            localStorage.setItem('player', JSON.stringify(player));
            
            showSuccess('欢迎来到魔法学院！正在进入游戏...');
            
            setTimeout(() => {
                window.location.href = '/game';
            }, 1500);
        }

        // 检查是否已有游戏数据
        function checkExistingGame() {
            const player = localStorage.getItem('player');
            if (player) {
                const playerData = JSON.parse(player);
                document.getElementById('player-name').value = playerData.username;
                showSuccess(`欢迎回来，${playerData.username}！`);
            }
        }

        // 回车键开始游戏
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                startGame();
            }
        });

        // 页面加载时检查现有游戏
        window.addEventListener('load', checkExistingGame);
    </script>
</body>
</html>

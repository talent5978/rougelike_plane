<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法学院冒险记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .logo {
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .title {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2em;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .form-container {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            min-width: 120px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #764ba2, #667eea);
        }

        .toggle-form {
            margin-top: 20px;
            cursor: pointer;
            text-decoration: underline;
            opacity: 0.8;
        }

        .toggle-form:hover {
            opacity: 1;
        }

        .features {
            margin-top: 30px;
            text-align: left;
        }

        .features h3 {
            margin-bottom: 15px;
            text-align: center;
            color: #4ecdc4;
        }

        .features ul {
            list-style: none;
            padding: 0;
        }

        .features li {
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .features li:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .features li::before {
            content: "✨ ";
            margin-right: 10px;
        }

        .error {
            color: #ff6b6b;
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 107, 107, 0.2);
            border-radius: 8px;
            display: none;
        }

        .success {
            color: #4ecdc4;
            margin-top: 10px;
            padding: 10px;
            background: rgba(78, 205, 196, 0.2);
            border-radius: 8px;
            display: none;
        }

        .loading {
            display: none;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #4ecdc4;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏰</div>
        <h1 class="title">魔法学院冒险记</h1>
        <p class="subtitle">踏上奇幻的冒险之旅</p>

        <div id="login-form" class="form-container">
            <div class="form-group">
                <label for="login-username">用户名</label>
                <input type="text" id="login-username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label for="login-password">密码</label>
                <input type="password" id="login-password" placeholder="请输入密码" required>
            </div>
            <button class="btn" onclick="login()">登录游戏</button>
            <div class="toggle-form" onclick="toggleForm()">没有账号？点击注册</div>
        </div>

        <div id="register-form" class="form-container hidden">
            <div class="form-group">
                <label for="register-username">用户名</label>
                <input type="text" id="register-username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label for="register-password">密码</label>
                <input type="password" id="register-password" placeholder="请输入密码" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">确认密码</label>
                <input type="password" id="confirm-password" placeholder="请确认密码" required>
            </div>
            <button class="btn" onclick="register()">创建角色</button>
            <div class="toggle-form" onclick="toggleForm()">已有账号？点击登录</div>
        </div>

        <div class="loading">
            <div class="spinner"></div>
            <p>正在连接魔法学院...</p>
        </div>

        <div class="error" id="error-message"></div>
        <div class="success" id="success-message"></div>

        <div class="features">
            <h3>🎮 游戏特色</h3>
            <ul>
                <li>回合制战斗系统，策略性十足</li>
                <li>丰富的技能和装备系统</li>
                <li>多样化的怪物和Boss挑战</li>
                <li>完整的成长和升级体验</li>
                <li>任务系统和成就收集</li>
                <li>实时排行榜竞技</li>
            </ul>
        </div>
    </div>

    <script>
        const API_BASE = '';

        function toggleForm() {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            
            loginForm.classList.toggle('hidden');
            registerForm.classList.toggle('hidden');
            
            clearMessages();
        }

        function showLoading() {
            document.querySelector('.loading').style.display = 'block';
        }

        function hideLoading() {
            document.querySelector('.loading').style.display = 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
        }

        function clearMessages() {
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('success-message').style.display = 'none';
        }

        async function login() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            if (!username || !password) {
                showError('请填写完整的登录信息');
                return;
            }

            showLoading();
            clearMessages();

            try {
                const response = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('player', JSON.stringify(data.player));
                    showSuccess('登录成功！正在进入游戏...');
                    
                    setTimeout(() => {
                        window.location.href = '/game';
                    }, 1500);
                } else {
                    showError(data.error || '登录失败');
                }
            } catch (error) {
                showError('网络连接失败，请稍后重试');
            } finally {
                hideLoading();
            }
        }

        async function register() {
            const username = document.getElementById('register-username').value.trim();
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (!username || !password || !confirmPassword) {
                showError('请填写完整的注册信息');
                return;
            }

            if (username.length < 3 || username.length > 20) {
                showError('用户名长度应在3-20字符之间');
                return;
            }

            if (password.length < 6) {
                showError('密码长度至少6位');
                return;
            }

            if (password !== confirmPassword) {
                showError('两次输入的密码不一致');
                return;
            }

            showLoading();
            clearMessages();

            try {
                const response = await fetch(`${API_BASE}/api/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('player', JSON.stringify(data.player));
                    showSuccess('注册成功！欢迎来到魔法学院！');
                    
                    setTimeout(() => {
                        window.location.href = '/game';
                    }, 1500);
                } else {
                    showError(data.error || '注册失败');
                }
            } catch (error) {
                showError('网络连接失败，请稍后重试');
            } finally {
                hideLoading();
            }
        }

        // 检查是否已登录
        function checkLogin() {
            const token = localStorage.getItem('token');
            if (token) {
                // 验证token是否有效
                fetch(`${API_BASE}/api/player`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                }).then(response => {
                    if (response.ok) {
                        window.location.href = '/game';
                    } else {
                        localStorage.removeItem('token');
                        localStorage.removeItem('player');
                    }
                }).catch(() => {
                    // 网络错误，继续显示登录界面
                });
            }
        }

        // 回车键登录
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const loginForm = document.getElementById('login-form');
                const registerForm = document.getElementById('register-form');
                
                if (!loginForm.classList.contains('hidden')) {
                    login();
                } else if (!registerForm.classList.contains('hidden')) {
                    register();
                }
            }
        });

        // 页面加载时检查登录状态
        checkLogin();
    </script>
</body>
</html>
